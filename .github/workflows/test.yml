name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        neovim: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      # The Telescope and plenary commits the plugin was developed with.
      - name: Fetch dependencies
        run: |
          mkdir -p deps
          git clone --quiet https://github.com/nvim-telescope/telescope.nvim deps/telescope.nvim
          git -C deps/telescope.nvim checkout --quiet 9377230aa5305d9e9aca4ed8dadf1070fb4aa9fc
          git clone --quiet https://github.com/nvim-lua/plenary.nvim deps/plenary.nvim
          git -C deps/plenary.nvim checkout --quiet 74b06c6c75e4eeb3108ec01852001636d85a932b
      # The chat's search tool runs ripgrep, which the runner image does not include.
      - name: Install ripgrep
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      # Tree-sitter parsers for Python (v0.25.0) and Rust (v0.24.2), which Neovim does not bundle:
      # the tests of the repo map, outlines and cited-code highlighting use them.
      - name: Build Tree-sitter parsers
        run: |
          mkdir -p deps/site/parser
          build() {
            git clone --quiet "https://github.com/tree-sitter/tree-sitter-$1" "deps/tree-sitter-$1"
            git -C "deps/tree-sitter-$1" checkout --quiet "$2"
            cc -shared -fPIC -O2 -I "deps/tree-sitter-$1/src" "deps/tree-sitter-$1/src/parser.c" \
              "deps/tree-sitter-$1/src/scanner.c" -o "deps/site/parser/$1.so"
          }
          build python 293fdc02038ee2bf0e2e206711b69c90ac0d413f
          build rust 77a3747266f4d621d0757825e6b11edcbf991ca5
      - name: Run tests
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          SYNOPSIS_DEPS=$PWD/deps tests/run.sh
